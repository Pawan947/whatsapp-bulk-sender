<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Manager</title>
    <style>
        /* CSS Variables */
        :root {
            --red-primary: #161313;
            --black-primary: #212121;
            --gray-dark: #424242;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: var(--black-primary);
            color: var(--white);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Layout */
        .container {
            flex: 1;
            max-width: 900px;
            margin: 20px;
            padding: 20px;
        }

        .side-panel {
            width: 350px;
            
            background: var(--gray-dark);
            padding: 20px;
            margin: 0;
            border-radius: 8px;
            box-shadow: var(--shadow);
            height: calc(100vh - 40px);
            overflow-y: auto;
            position: sticky;
            top: 20px;
        }

        /* Header */
        .header {
            background: var(--red-primary);
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header h6 {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.8;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: var(--gray-dark);
            border: none;
            padding: 10px 24px;
            color: var(--white);
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.3s ease;
            font-weight: 500;
            flex-shrink: 0;
            min-width: 20%;
            max-width: 20%;
        }

        .tab-btn:hover,
        .tab-btn.active {
            background: var(--red-primary);
        }

        .tabs::-webkit-scrollbar {
            height: 6px;
        }

        .tabs::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .tabs::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            background: var(--gray-dark);
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .tab-content.active {
            display: block;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #616161;
            background: var(--black-primary);
            color: var(--white);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--red-primary);
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            background: var(--red-primary);
            color: var(--white);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        button:hover:not(:disabled) {
            background: #b71c1c;
        }

        button:disabled {
            background: #757575;
            cursor: not-allowed;
        }

        /* Specific Components */
        .messages {
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            background: var(--black-primary);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            box-shadow: var(--shadow);
        }

        #qrDisplay {
            text-align: center;
            padding: 20px;
        }

        #qrCanvas {
            background: var(--white);
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: var(--shadow);
            min-height: 230px;
            min-width: 230px;
        }

        #qrCanvas img {
            width: 200px;
            height: 200px;
        }

        #qrStatus {
            margin-top: 15px;
            font-style: italic;
            font-size: 14px;
        }

        #sendLog {
            max-height: calc(100% - 40px);
            overflow-y: auto;
        }

        .log-entry {
            padding: 8px;
            border-bottom: 1px solid #616161;
            font-size: 14px;
        }

        .log-entry.error {
            color: #ef5350;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #616161;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--red-primary);
            width: 0;
            transition: width 0.3s ease;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin: 8px 0;
        }

        h2, h3 {
            margin-bottom: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Side Panel for Logs -->
    <aside class="side-panel">
        <h2>Sending Log</h2>
        <div id="sendLog"></div>
    </aside>

    <!-- Main Content -->
    <main class="container">
        <header class="header">
            <h1>WhatsApp Manager</h1>
            <h6>Developed by inst:pawan_.387</h6>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tabs">
            <button class="tab-btn active" data-tab="auth">Authentication</button>
            <button class="tab-btn" data-tab="qr">QR Code</button>
            <button class="tab-btn" data-tab="messages">Messages</button>
            <button class="tab-btn" data-tab="send">Send Message</button>
            <button class="tab-btn" data-tab="bulk">Bulk Send</button>
            <button class="tab-btn" data-tab="polls">Polls</button>
            <button class="tab-btn" data-tab="gemini">LLM</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
        </nav>

        <!-- Tab Contents -->
        <section id="auth" class="tab-content active">
            <div class="form-group">
                <input type="number" id="daysInput" placeholder="Enter number of days for access" min="1" required>
                <button id="registerBtn">Register Device</button>
                <input type="text" id="otpInput" placeholder="Enter OTP" required>
                <button id="verifyBtn">Verify OTP</button>
                <p id="authStatus"></p>
            </div>
        </section>

        <section id="qr" class="tab-content">
            <div id="qrDisplay">
                <div id="qrCanvas"></div>
                <p id="qrStatus">Initializing...</p>
            </div>
        </section>

        <section id="messages" class="tab-content">
            <div class="messages" id="messageList"></div>
        </section>

        <section id="send" class="tab-content">
            <div class="form-group">
                <input type="text" id="number" placeholder="Phone Number (e.g., 123456789012)" required>
                <textarea id="message" placeholder="Enter your message" required></textarea>
                <input type="file" id="attachment">
                <button id="sendBtn">Send Message</button>
            </div>
        </section>

        <section id="bulk" class="tab-content">
            <div class="form-group">
                <textarea id="numbers" placeholder="Numbers (one per line, e.g., 123456789012)" required></textarea>
                <select id="promptSelect"></select>
                <textarea id="bulkMessage" placeholder="Enter your message (use {var1,var2} for variations)" required></textarea>
                <select id="bulkType">
                    <option value="text">Text Message</option>
                    <option value="poll">Poll</option>
                </select>
                <textarea id="pollOptions" placeholder="Poll options (one per line)" style="display: none;"></textarea>
                <input type="file" id="bulkAttachment">
                <label><input type="checkbox" id="resume"> Resume from last pause</label>
                <button id="sendBulkBtn">Start Bulk Send</button>
                <button id="pauseBulkBtn" style="display: none;">Pause Sending</button>
                <button id="generateDullBtn">Generate Dull Text</button>
                <div class="progress-bar">
                    <div id="bulkProgress" class="progress-fill"></div>
                </div>
            </div>
        </section>

        <section id="polls" class="tab-content">
            <div id="pollList"></div>
        </section>

        <section id="gemini" class="tab-content">
            <div class="form-group">
                <h3>Generate Marketing Post</h3>
                <input type="text" id="companyName" placeholder="Company Name (e.g., UrbanFit Apparel)" required>
                <input type="text" id="productDetails" placeholder="Product Details (e.g., Premium skirts)" required>
                <select id="targetGender">
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="unisex">Unisex</option>
                </select>
                <input type="text" id="targetAudience" placeholder="Target Audience (e.g., Active women aged 18-35)" required>
                <input type="text" id="tone" placeholder="Tone (e.g., empowering)" required>
                <input type="text" id="keySellingPoints" placeholder="Key Selling Points (e.g., 4-way stretch, sweat-wicking)" required>
                <input type="text" id="callToAction" placeholder="Call to Action (e.g., Get 25% OFF)" required>
                <input type="text" id="currentPromotion" placeholder="Current Promotion (e.g., New Collection Launch)" required>
                <button id="generateMarketingBtn">Generate Marketing Post</button>
                <textarea id="geminiResponse" placeholder="Generated post will appear here" readonly></textarea>
                <button id="savePromptBtn">Save Prompt</button>
                <select id="promptSelectGemini"></select>
                <button id="generateBtn">Generate Response</button>
            </div>
        </section>

        <section id="settings" class="tab-content">
            <div class="form-group">
                <h3>Bulk Send Settings</h3>
                <label>Daily Message Limit: <input type="number" id="dailyLimit" value="500" min="1" required></label>
                <label>Batch Size (50-100): <input type="number" id="batchSize" value="50" min="50" max="100" required></label>
                <label>Batch Gap (hours): <input type="number" id="batchGap" value="1" min="1" max="2" step="0.5" required></label>
                <label>Min Message Delay (seconds): <input type="number" id="minMessageDelay" value="30" min="30" max="120" required></label>
                <label>Max Message Delay (seconds): <input type="number" id="maxMessageDelay" value="120" min="30" max="120" required></label>
                <label>Non-Peak Start (hour, 0-23): <input type="number" id="nonPeakStart" value="2" min="0" max="23" required></label>
                <label>Non-Peak End (hour, 0-23): <input type="number" id="nonPeakEnd" value="5" min="0" max="23" required></label>
                <button id="saveSettingsBtn">Save Settings</button>
            </div>
        </section>
    </main>

    <!-- External Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
    <script>
        // Wait for DOM to fully load
        document.addEventListener('DOMContentLoaded', () => {
            // Check for Electron API availability
            if (!window.electronAPI) {
                console.error('Electron API not available. Verify preload.js and main.js configuration.');
                document.getElementById('authStatus').textContent = 'Error: Electron API not loaded';
                return;
            }

            // Initialize Socket.IO
            const socket = io('http://localhost:3000');

            // DOM Elements
            const elements = {
                tabs: document.querySelectorAll('.tab-btn'),
                contents: document.querySelectorAll('.tab-content'),
                qrCanvas: document.getElementById('qrCanvas'),
                qrStatus: document.getElementById('qrStatus'),
                sendLog: document.getElementById('sendLog'),
                sendBulkBtn: document.getElementById('sendBulkBtn'),
                pauseBulkBtn: document.getElementById('pauseBulkBtn'),
                authStatus: document.getElementById('authStatus'),
                messageList: document.getElementById('messageList')
            };

            // State Management
            let state = {
                isSending: false,
                geminiResponse: '',
                messages: [],
                pollVotes: {},
                settings: JSON.parse(localStorage.getItem('bulkSettings')) || {
                    dailyLimit: 500,
                    batchSize: 50,
                    batchGap: 1,
                    minMessageDelay: 30,
                    maxMessageDelay: 120,
                    nonPeakStart: 2,
                    nonPeakEnd: 5
                },
                isAuthenticated: false,
                token: localStorage.getItem('sessionToken') || null
            };

            // Utility Functions
            const updateTabVisibility = () => {
                elements.tabs.forEach(tab => {
                    tab.style.display = (tab.dataset.tab === 'auth' || state.isAuthenticated) ? 'block' : 'none';
                });
                if (!state.isAuthenticated) {
                    elements.tabs.forEach(t => t.classList.remove('active'));
                    elements.contents.forEach(c => c.classList.remove('active'));
                    document.querySelector('.tab-btn[data-tab="auth"]').classList.add('active');
                    document.getElementById('auth').classList.add('active');
                }
            };

            const generateQrCodeUrl = (qrData) => {
                if (!qrData) {
                    console.error('No QR code data provided');
                    elements.qrStatus.textContent = 'Error: No QR code data received';
                    return null;
                }
                return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;
            };

            const displayQrCode = (qrData) => {
                const qrCodeUrl = generateQrCodeUrl(qrData);
                if (!qrCodeUrl) return;
                elements.qrCanvas.innerHTML = `<img src="${qrCodeUrl}" alt="QR Code" width="200" height="200">`;
            };

            const loadSettings = () => {
                document.getElementById('dailyLimit').value = state.settings.dailyLimit;
                document.getElementById('batchSize').value = state.settings.batchSize;
                document.getElementById('batchGap').value = state.settings.batchGap;
                document.getElementById('minMessageDelay').value = state.settings.minMessageDelay;
                document.getElementById('maxMessageDelay').value = state.settings.maxMessageDelay;
                document.getElementById('nonPeakStart').value = state.settings.nonPeakStart;
                document.getElementById('nonPeakEnd').value = state.settings.nonPeakEnd;
            };

            const saveSettings = () => {
                state.settings = {
                    dailyLimit: parseInt(document.getElementById('dailyLimit').value) || 500,
                    batchSize: Math.min(Math.max(parseInt(document.getElementById('batchSize').value), 50), 100),
                    batchGap: parseFloat(document.getElementById('batchGap').value) || 1,
                    minMessageDelay: parseInt(document.getElementById('minMessageDelay').value) || 30,
                    maxMessageDelay: parseInt(document.getElementById('maxMessageDelay').value) || 120,
                    nonPeakStart: parseInt(document.getElementById('nonPeakStart').value) || 2,
                    nonPeakEnd: parseInt(document.getElementById('nonPeakEnd').value) || 5
                };
                localStorage.setItem('bulkSettings', JSON.stringify(state.settings));
                alert('Settings saved successfully!');
            };

            // API Interaction Functions
            const fetchQrStatus = async () => {
                try {
                    const data = await window.electronAPI.getQR(state.token);
                    if (data.authenticated) {
                        state.isAuthenticated = true;
                        elements.qrCanvas.innerHTML = '';
                        elements.qrStatus.textContent = 'Connected Successfully!';
                        updateTabVisibility();
                        updateMessages();
                        updatePolls();
                    } else if (data.qr) {
                        elements.qrStatus.textContent = 'Scan QR Code to Connect';
                        displayQrCode(data.qr);
                    } else {
                        elements.qrStatus.textContent = 'Waiting for QR Code...';
                    }
                } catch (error) {
                    elements.qrStatus.textContent = 'Authentication required';
                    console.error('QR status fetch error:', error.message);
                }
            };

            const updateMessages = async () => {
                if (!state.isAuthenticated) return;
                try {
                    state.messages = await window.electronAPI.getMessages(state.token);
                    elements.messageList.innerHTML = state.messages.map(m => `
                        <div class="message">
                            <strong>From:</strong> ${m.from || 'Unknown'}<br>
                            <strong>Message:</strong> ${m.body || 'No content'}<br>
                            ${m.type === 'media' ? '<em>(Media with caption)</em><br>' : ''}
                            <strong>Time:</strong> ${m.timestamp || 'N/A'}
                        </div>
                    `).join('');
                } catch (error) {
                    console.error('Messages fetch error:', error.message);
                }
            };

            const updatePolls = async (pollsData = null) => {
                if (!state.isAuthenticated) return;
                try {
                    const { polls, pollVotes } = await window.electronAPI.getPolls(state.token);
                    const pollsToUse = pollsData || polls;
                    state.pollVotes = pollVotes || state.pollVotes;
                    elements.pollList.innerHTML = Object.entries(pollsToUse).map(([id, poll]) => `
                        <div class="message">
                            <strong>Question:</strong> ${poll.question || 'N/A'}<br>
                            <strong>Options:</strong> ${(poll.options || []).join(', ') || 'No options'}<br>
                            <strong>Votes:</strong> ${JSON.stringify(state.pollVotes[id] || {})}
                        </div>
                    `).join('');
                } catch (error) {
                    console.error('Polls fetch error:', error.message);
                }
            };

            const register = async () => {
                const days = document.getElementById('daysInput').value.trim();
                if (!days || isNaN(days) || days < 1) {
                    elements.authStatus.textContent = 'Please enter a valid number of days';
                    return;
                }
                try {
                    const data = await window.electronAPI.register(days);
                    elements.authStatus.textContent = data.message || 'Registration initiated';
                } catch (error) {
                    elements.authStatus.textContent = error.message || 'Registration failed';
                }
            };

            const verifyOTP = async () => {
                const otp = document.getElementById('otpInput').value.trim();
                if (!otp) {
                    elements.authStatus.textContent = 'Please enter OTP';
                    return;
                }
                try {
                    const data = await window.electronAPI.verifyOTP(otp);
                    elements.authStatus.textContent = data.message || 'OTP verified';
                    if (data.token) {
                        state.isAuthenticated = true;
                        state.token = data.token;
                        localStorage.setItem('sessionToken', state.token);
                        updateTabVisibility();
                        document.querySelector('.tab-btn[data-tab="qr"]').click();
                    }
                } catch (error) {
                    elements.authStatus.textContent = error.message || 'OTP verification failed';
                    if (error.message?.includes('Invalid OTP')) {
                        alert('Invalid OTP. Application will restart.');
                        window.location.reload();
                    }
                }
            };

            const arrayBufferToBase64 = (buffer) => {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
};

const sendMessage = async () => {
    if (!state.isAuthenticated) return alert('Please authenticate first');
    const number = document.getElementById('number').value.trim();
    const message = document.getElementById('message').value.trim();
    const fileInput = document.getElementById('attachment');
    const file = fileInput.files[0];
    let attachmentData = null;

    if (!number || !message) return alert('Number and message are required');

    if (file) {
        const reader = new FileReader();
        attachmentData = await new Promise((resolve, reject) => {
            reader.onload = () => resolve({
                name: file.name,
                data: arrayBufferToBase64(reader.result), // Use the utility function here
                mimetype: file.type || 'application/octet-stream'
            });
            reader.onerror = () => reject(new Error('Failed to read file'));
            reader.readAsArrayBuffer(file);
        });
    }

    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    try {
        await window.electronAPI.sendMessage({ token: state.token, number, message, attachment: attachmentData });
        const feedback = attachmentData 
            ? `Media sent with caption "${message}" to ${number}` 
            : `Message "${message}" sent to ${number}`;
        elements.sendLog.innerHTML += `<div class="log-entry">${feedback}</div>`;
        elements.sendLog.scrollTop = elements.sendLog.scrollHeight;
        document.getElementById('number').value = '';
        document.getElementById('message').value = '';
        fileInput.value = '';
        alert('Message sent successfully!');
    } catch (error) {
        console.error('Send message error:', error);
        alert(`Message send failed: ${error.message}`);
        elements.sendLog.innerHTML += `<div class="log-entry error">Failed to send to ${number}: ${error.message}</div>`;
    } finally {
        sendBtn.disabled = false;
    }
};

const sendBulk = async () => {
    if (!state.isAuthenticated) return alert('Please authenticate first');
    if (state.isSending) return alert('Bulk send in progress');

    const numbers = document.getElementById('numbers').value.split('\n').map(n => n.trim()).filter(Boolean);
    const message = document.getElementById('bulkMessage').value.trim();
    const type = document.getElementById('bulkType').value;
    const options = document.getElementById('pollOptions').value.split('\n').map(o => o.trim()).filter(Boolean);
    const resume = document.getElementById('resume').checked;
    const fileInput = document.getElementById('bulkAttachment');
    const file = fileInput.files[0];
    let attachmentData = null;

    if (!numbers.length || !message) return alert('Numbers and message are required');
    if (type === 'poll' && !options.length) return alert('Poll options required');

    if (file) {
        const reader = new FileReader();
        attachmentData = await new Promise((resolve, reject) => {
            reader.onload = () => resolve({
                name: file.name,
                data: arrayBufferToBase64(reader.result), // Replace Buffer with arrayBufferToBase64
                mimetype: file.type || 'application/octet-stream'
            });
            reader.onerror = () => reject(new Error('Failed to read file'));
            reader.readAsArrayBuffer(file);
        });
    }

    const variables = [];
    const regex = /\{([^}]+)\}/g;
    let match;
    while ((match = regex.exec(message))) {
        variables.push(match[1].split(',').map(opt => opt.trim()).filter(Boolean));
    }

    try {
        await window.electronAPI.sendBulk({
            token: state.token,
            numbers,
            message,
            type,
            options,
            resume,
            variables,
            settings: state.settings,
            attachment: attachmentData
        });
    } catch (error) {
        elements.sendLog.innerHTML += `<div class="log-entry error">Bulk send error: ${error.message}</div>`;
    }
};

// No changes needed for pauseBulk or generateDullText, included for context
const pauseBulk = async () => {
    if (!state.isSending) return alert('No bulk send in progress');
    try {
        await window.electronAPI.pauseBulk(state.token);
    } catch (error) {
        elements.sendLog.innerHTML += `<div class="log-entry error">Pause error: ${error.message}</div>`;
    }
};

const generateDullText = async () => {
    if (!state.isAuthenticated) return alert('Please authenticate first');
    const text = document.getElementById('bulkMessage').value.trim();
    if (!text) return alert('Enter a message to generate dull text');
    try {
        const { response } = await window.electronAPI.generateResponse({
            token: state.token,
            prompt: `Generate a short, less engaging version of: ${text}`
        });
        document.getElementById('bulkMessage').value = response;
    } catch (error) {
        alert(`Dull text generation failed: ${error.message}`);
    }
};

            const generateMarketingPost = async () => {
                if (!state.isAuthenticated) return alert('Please authenticate first');
                const fields = {
                    companyName: document.getElementById('companyName').value.trim(),
                    productDetails: document.getElementById('productDetails').value.trim(),
                    targetGender: document.getElementById('targetGender').value,
                    targetAudience: document.getElementById('targetAudience').value.trim(),
                    tone: document.getElementById('tone').value.trim(),
                    keySellingPoints: document.getElementById('keySellingPoints').value.trim(),
                    callToAction: document.getElementById('callToAction').value.trim(),
                    currentPromotion: document.getElementById('currentPromotion').value.trim()
                };

                if (Object.values(fields).some(val => !val)) return alert('All fields are required');

                const generateBtn = document.getElementById('generateMarketingBtn');
                generateBtn.disabled = true;
                try {
                    const prompt = `
                        As an expert WhatsApp marketer, create a gender-optimized message with:
                        Company: ${fields.companyName}
                        Product: ${fields.productDetails}
                        Target Gender: ${fields.targetGender}
                        Audience: ${fields.targetAudience}
                        Tone: ${fields.tone}
                        Key Points: ${fields.keySellingPoints}
                        CTA: ${fields.callToAction}
                        Current offer: ${fields.currentPromotion}
                    `;
                    const { response } = await window.electronAPI.generateResponse({ token: state.token, prompt });
                    state.geminiResponse = response;
                    document.getElementById('geminiResponse').value = response;
                } catch (error) {
                    document.getElementById('geminiResponse').value = `Error: ${error.message}`;
                } finally {
                    generateBtn.disabled = false;
                }
            };

            const savePrompt = async () => {
                if (!state.isAuthenticated) return alert('Please authenticate first');
                const prompt = document.getElementById('geminiResponse').value.trim();
                if (!prompt) return alert('No prompt to save');
                try {
                    const prompts = await window.electronAPI.savePrompt({ token: state.token, prompt });
                    document.getElementById('geminiResponse').value = 'Prompt saved successfully.';
                    socket.emit('geminiPrompts', prompts);
                } catch (error) {
                    alert(`Save prompt failed: ${error.message}`);
                }
            };

            const generateResponse = async () => {
                if (!state.isAuthenticated) return alert('Please authenticate first');
                const prompt = document.getElementById('promptSelectGemini').value;
                if (!prompt) return alert('Select a prompt first');
                const generateBtn = document.getElementById('generateBtn');
                generateBtn.disabled = true;
                try {
                    const { response } = await window.electronAPI.generateResponse({ token: state.token, prompt });
                    state.geminiResponse = response;
                    document.getElementById('geminiResponse').value = response;
                } catch (error) {
                    document.getElementById('geminiResponse').value = `Error: ${error.message}`;
                } finally {
                    generateBtn.disabled = false;
                }
            };

            // Socket Event Listeners
            socket.on('connect', () => {
                fetchQrStatus();
                updateTabVisibility();
            });

            socket.on('qrUpdate', qr => {
                elements.qrStatus.textContent = 'Scan QR Code to Connect';
                displayQrCode(qr);
            });

            socket.on('authSuccess', () => {
                if (state.isAuthenticated) {
                    elements.qrCanvas.innerHTML = '';
                    elements.qrStatus.textContent = 'Connected Successfully!';
                    updateTabVisibility();
                    updateMessages();
                    updatePolls();
                }
            });

            socket.on('connection complete', () => {
                elements.qrStatus.textContent = 'WhatsApp Client Ready';
            });

            socket.on('clientDisconnected', reason => {
                elements.qrCanvas.innerHTML = '';
                elements.qrStatus.textContent = `Disconnected: ${reason}. Reconnecting...`;
                state.isAuthenticated = false;
                updateTabVisibility();
                fetchQrStatus();
            });

            socket.on('newMessage', messages => {
                state.messages = messages;
                updateMessages();
            });

            socket.on('pollUpdate', ({ pollId, votes }) => {
                state.pollVotes[pollId] = votes;
                updatePolls();
            });

            socket.on('init', ({ messages, polls, pollVotes, authenticated, qr }) => {
                state.messages = messages || [];
                state.pollVotes = pollVotes || {};
                state.isAuthenticated = authenticated;
                updateTabVisibility();
                if (state.isAuthenticated) {
                    updateMessages();
                    updatePolls(polls);
                    elements.qrStatus.textContent = 'Connected Successfully!';
                    elements.qrCanvas.innerHTML = '';
                } else if (qr) {
                    elements.qrStatus.textContent = 'Scan QR Code to Connect';
                    displayQrCode(qr);
                } else {
                    elements.qrStatus.textContent = 'Waiting for QR Code...';
                }
            });

            socket.on('bulkStart', ({ total, current }) => {
                state.isSending = true;
                elements.sendLog.innerHTML = `<div class="log-entry">Starting bulk send to ${total} numbers...</div>`;
                elements.sendBulkBtn.style.display = 'none';
                elements.pauseBulkBtn.style.display = 'block';
                document.getElementById('bulkProgress').style.width = `${(current / total * 100)}%`;
            });

            socket.on('bulkProgress', ({ number, status, current, total }) => {
                elements.sendLog.innerHTML += `<div class="log-entry">${number}: ${status} (${current}/${total})</div>`;
                elements.sendLog.scrollTop = elements.sendLog.scrollHeight;
                document.getElementById('bulkProgress').style.width = `${(current / total * 100)}%`;
            });

            socket.on('bulkPaused', ({ current, total }) => {
                state.isSending = false;
                elements.sendLog.innerHTML += `<div class="log-entry">Paused at ${current}/${total}</div>`;
                elements.sendBulkBtn.style.display = 'block';
                elements.pauseBulkBtn.style.display = 'none';
            });

            socket.on('bulkComplete', ({ total }) => {
                state.isSending = false;
                elements.sendLog.innerHTML += `<div class="log-entry">Completed sending to ${total} numbers</div>`;
                elements.sendBulkBtn.style.display = 'block';
                elements.pauseBulkBtn.style.display = 'none';
                document.getElementById('bulkProgress').style.width = '100%';
            });

            socket.on('bulkError', ({ message }) => {
                state.isSending = false;
                elements.sendLog.innerHTML += `<div class="log-entry error">Error: ${message}</div>`;
                elements.sendBulkBtn.style.display = 'block';
                elements.pauseBulkBtn.style.display = 'none';
            });

            socket.on('geminiPrompts', prompts => {
                const options = prompts.map(p => `<option value="${p}">${p}</option>`).join('');
                document.getElementById('promptSelect').innerHTML = options;
                document.getElementById('promptSelectGemini').innerHTML = options;
            });

            // Event Listeners
            elements.tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    if (tab.dataset.tab !== 'auth' && !state.isAuthenticated) {
                        alert('Authentication required');
                        return;
                    }
                    elements.tabs.forEach(t => t.classList.remove('active'));
                    elements.contents.forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.tab).classList.add('active');

                    switch (tab.dataset.tab) {
                        case 'qr': if (state.isAuthenticated) fetchQrStatus(); break;
                        case 'messages': if (state.isAuthenticated) updateMessages(); break;
                        case 'polls': if (state.isAuthenticated) updatePolls(); break;
                        case 'settings': loadSettings(); break;
                    }
                });
            });

            document.getElementById('bulkType').addEventListener('change', e => {
                document.getElementById('pollOptions').style.display = e.target.value === 'poll' ? 'block' : 'none';
            });

            document.getElementById('promptSelect').addEventListener('change', e => {
                document.getElementById('bulkMessage').value = e.target.value;
            });

            document.getElementById('registerBtn').addEventListener('click', register);
            document.getElementById('verifyBtn').addEventListener('click', verifyOTP);
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('sendBulkBtn').addEventListener('click', sendBulk);
            document.getElementById('pauseBulkBtn').addEventListener('click', pauseBulk);
            document.getElementById('generateDullBtn').addEventListener('click', generateDullText);
            document.getElementById('generateMarketingBtn').addEventListener('click', generateMarketingPost);
            document.getElementById('savePromptBtn').addEventListener('click', savePrompt);
            document.getElementById('generateBtn').addEventListener('click', generateResponse);
            document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);

            // Initial Setup
            updateTabVisibility();
            fetchQrStatus();
        });
    </script>
</body>
</html>
